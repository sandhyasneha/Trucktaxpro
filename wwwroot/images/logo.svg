<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 70" width="100%" height="100%">
  <!-- Icon Group: Shield + Truck Motif -->
  <g transform="translate(5, 5)">
    <!-- Dark Navy Shield Container -->
    <path d="M30 2 L54 11 V37 C54 53 30 63 30 63 C30 63 6 53 6 37 V11 L30 2 Z" fill="#122338" stroke="#F5A623" stroke-width="2.5"/>
    
    <!-- White Truck Cab Silhouette -->
    <path d="M18 42 H42 V33 L37 23 H23 L18 33 Z" fill="#FFFFFF"/>
    <!-- Windshield -->
    <path d="M25 26 H35 L37 31 H23 Z" fill="#122338"/>
    <!-- Grille lines -->
    <rect x="22" y="35" width="16" height="2" fill="#122338"/>
    <rect x="22" y="38" width="16" height="2" fill="#122338"/>
    
    <!-- Orange Verified Checkmark -->
    <path d="M12 28 L23 40 L48 12" fill="none" stroke="#F5A623" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Brand Typography (White text with strong contrast) -->
  <text x="75" y="44" font-family="'Segoe UI', Roboto, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="0.5">
    TRUCK<tspan fill="#F5A623">TAX</tspan>PRO
  </text>
  
  <text x="76" y="58" font-family="'Segoe UI', Roboto, -apple-system, sans-serif" font-weight="600" font-size="9.5" fill="#F5A623" letter-spacing="2.5">
    IRS AUTHORIZED E-FILE
  </text>
</svg>
